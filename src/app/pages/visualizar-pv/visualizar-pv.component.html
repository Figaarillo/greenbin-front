<div data-role="vecino">
  <app-page-header title="Mapa"></app-page-header>

  <div class="container mt-3">
    <div class="w-100 map-container">
      @defer (on immediate) {
        <app-map-view
          [puntosVerdes]="puntosVerdes"
          [localesAdheridos]="localesAdheridos"
          [center]="center"
          [zoom]="zoom"
          [height]="mapHeight"
          (mapReady)="onMapReady($event)"
          (puntoVerdeClick)="abrirModal($event)"
          (localAdheridoClick)="abrirModalLocal($event)">
        </app-map-view>
      } @placeholder {
        <div class="map-placeholder">Cargando mapa…</div>
      }
    </div>
  </div>

  <app-modal-pv></app-modal-pv>
  <app-modal-local-adherido></app-modal-local-adherido>
</div>
