<div data-role="entidad">
  <app-table
    [columns]="columns"
    [title]="title"
    [tableData]="categorias"
    [loading]="loading"
    [createLabel]="'Nueva categoría'"
    [createRoute]="'/entidad/registrar-categoria'"
    (edit)="editCategoria($event)"
    (delete)="toggleCategoria($event)">
  </app-table>
</div>
