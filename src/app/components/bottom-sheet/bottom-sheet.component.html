<div class="sheet-wrapper" [class.is-open]="isOpen()">

  <!-- Backdrop con blur (cubre toda la página). El cierre al tocar afuera
       lo maneja el listener del componente, no este div. -->
  <div class="sheet-backdrop"></div>

  <!-- Clip: recorta la animación a la mitad del tabbar -->
  <div class="sheet-clip">
    <div class="sheet-panel">
      @if (handle) {
        <div class="sheet-handle"></div>
      }
      <ng-content></ng-content>
    </div>
  </div>
</div>
